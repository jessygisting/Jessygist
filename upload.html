<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Upload Images - JessyGist</title>

  <meta name="description"
        content="Upload images for use on JessyGist.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f1f5f9;
      color: #102a43;
      font-family: Arial, sans-serif;
    }

    header {
      background: #102a43;
      color: white;
      padding: 20px;
      text-align: center;
      border-radius: 12px;
    }

    .container {
      max-width: 550px;
      margin: 25px auto;
      padding: 22px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
    }

    h2 {
      color: #1769aa;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: bold;
    }

    input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: #1769aa;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #preview {
      display: none;
      width: 100%;
      max-height: 300px;
      margin-top: 18px;
      object-fit: contain;
      border-radius: 8px;
    }

    #status {
      margin-top: 18px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    #imageUrl {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }

    .back-link {
      display: inline-block;
      margin-top: 18px;
      color: #1769aa;
      text-decoration: none;
    }

    .note {
      font-size: 14px;
      line-height: 1.6;
      color: #52606d;
    }
  </style>
</head>

<body>

  <header>
    <h1>JessyGist</h1>
    <p>Image Upload Center</p>
  </header>

  <main class="container">

    <h2>Upload an Image</h2>

    <p>
      Select a picture from your phone and upload it
      to use in your JessyGist articles.
    </p>

    <form id="uploadForm">

      <label for="imageFile">Choose an image</label>

      <input
        type="file"
        id="imageFile"
        accept="image/jpeg,image/png,image/webp"
        required
      >

      <img id="preview" alt="Selected image preview">

      <button type="submit" id="uploadButton">
        Upload Image
      </button>

    </form>

    <div id="status" role="status" aria-live="polite"></div>

    <div id="result" hidden>
      <label for="imageUrl">Your Image URL</label>

      <input
        type="text"
        id="imageUrl"
        readonly
      >

      <button type="button" id="copyButton">
        Copy Image URL
      </button>
    </div>

    <p class="note">
      Accepted formats: JPG, PNG and WebP.
      Maximum file size: 5 MB.
      Only upload images you have permission to use.
    </p>

    <a class="back-link" href="./index.html">
      ← Return to JessyGist Homepage
    </a>

  </main>

  <script>
    const CLOUD_NAME = "kylngca3";
    const UPLOAD_PRESET = "jessygist_upload";

    const form = document.getElementById("uploadForm");
    const fileInput = document.getElementById("imageFile");
    const preview = document.getElementById("preview");
    const statusBox = document.getElementById("status");
    const uploadButton = document.getElementById("uploadButton");
    const resultBox = document.getElementById("result");
    const imageUrlInput = document.getElementById("imageUrl");
    const copyButton = document.getElementById("copyButton");

    let previewUrl = "";

    fileInput.addEventListener("change", function () {
      statusBox.textContent = "";
      resultBox.hidden = true;

      if (previewUrl) {
        URL.revokeObjectURL(previewUrl);
        previewUrl = "";
      }

      const file = fileInput.files[0];

      if (!file) {
        preview.style.display = "none";
        return;
      }

      const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp"
      ];

      if (!allowedTypes.includes(file.type)) {
        fileInput.value = "";
        preview.style.display = "none";
        statusBox.textContent =
          "Please select a JPG, PNG or WebP image.";
        return;
      }

      if (file.size > 5 * 1024 * 1024) {
        fileInput.value = "";
        preview.style.display = "none";
        statusBox.textContent =
          "Your image is larger than 5 MB. Please choose a smaller image.";
        return;
      }

      previewUrl = URL.createObjectURL(file);
      preview.src = previewUrl;
      preview.style.display = "block";
    });

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const file = fileInput.files[0];

      if (!file) {
        statusBox.textContent = "Please choose an image first.";
        return;
      }

      if (file.size > 5 * 1024 * 1024) {
        statusBox.textContent = "The maximum file size is 5 MB.";
        return;
      }

      uploadButton.disabled = true;
      uploadButton.textContent = "Uploading...";
      statusBox.textContent = "Please wait while your image uploads.";
      resultBox.hidden = true;

      try {
        const formData = new FormData();

        formData.append("file", file);
        formData.append("upload_preset", UPLOAD_PRESET);

        const response = await fetch(
          "https://api.cloudinary.com/v1_1/" +
          CLOUD_NAME +
          "/image/upload",
          {
            method: "POST",
            body: formData
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error?.message || "The image upload failed."
          );
        }

        imageUrlInput.value = data.secure_url;
        resultBox.hidden = false;

        statusBox.textContent =
          "Success! Your image has been uploaded.";

      } catch (error) {
        statusBox.textContent =
          "Upload failed: " + error.message +
          " Please check your Cloudinary preset and try again.";
      } finally {
        uploadButton.disabled = false;
        uploadButton.textContent = "Upload Image";
      }
    });

    copyButton.addEventListener("click", async function () {
      try {
        await navigator.clipboard.writeText(imageUrlInput.value);
        statusBox.textContent =
          "Image URL copied! You can paste it into your article.";
      } catch (error) {
        imageUrlInput.focus();
        imageUrlInput.select();

        statusBox.textContent =
          "Select the URL above and copy it.";
      }
    });
  </script>

</body>
</html>
